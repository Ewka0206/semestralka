# === MariaDB – uprav heslo dle svého nastavení ===
spring.datasource.url=jdbc:mariadb://localhost:3306/sailconnect?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Sail2026
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate vytvoří / aktualizuje tabulky automaticky
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

server.port=8080

images.dir=../frontend/public/images/
upload.dir=../frontend/public/images/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# === JWT ===
# Tajný klíč musí mít alespoň 32 znaků (256 bitů) pro HMAC-SHA256
jwt.secret=SailConnectSecretKey2026MustBe32BytesLong!!
# Platnost tokenu: 24 hodin (v milisekundách)
jwt.expiration-ms=86400000

# === Actuator – monitoring / health-check ===
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
